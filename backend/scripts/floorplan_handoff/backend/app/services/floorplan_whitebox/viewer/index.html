<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whitebox GLB Viewer</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2933;
      --muted: #6b7280;
      --line: #d9dee5;
      --panel: #f7f8fa;
      --accent: #1769aa;
      --bg: #eef1f4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      letter-spacing: 0;
    }

    .shell {
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      min-height: 100vh;
    }

    aside {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 18px;
      border-right: 1px solid var(--line);
      background: var(--panel);
    }

    main {
      position: relative;
      min-width: 0;
      min-height: 100vh;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 720;
      line-height: 1.2;
    }

    .group {
      display: grid;
      gap: 10px;
    }

    label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: white;
      font: inherit;
    }

    input[type="text"] {
      height: 38px;
    }

    textarea {
      min-height: 180px;
      padding: 10px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.45;
    }

    input[type="file"] {
      width: 100%;
      color: var(--muted);
      font: inherit;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric {
      min-height: 62px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 18px;
    }

    #status {
      min-height: 44px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: white;
      font-size: 13px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    #status.busy {
      border-color: #1769aa;
      color: #0f4f84;
      background: #eef7ff;
    }

    #status.success {
      border-color: #2d8a5f;
      color: #1f6b49;
      background: #effaf4;
    }

    #status.error {
      border-color: #c75151;
      color: #9e2f2f;
      background: #fff1f1;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.72;
    }

    #viewport {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (max-width: 760px) {
      .shell {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      main {
        min-height: 66vh;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <h1>Whitebox GLB Viewer</h1>

      <div class="group">
        <label for="modelUrl">Model URL</label>
        <input id="modelUrl" type="text" value="/outputs/floorplans/sample_floorplan_whitebox/whitebox.glb">
        <div class="buttons">
          <button class="primary" id="loadUrl" type="button">Load</button>
          <button id="resetView" type="button">Reset</button>
        </div>
      </div>

      <div class="group">
        <label for="fileInput">Local GLB</label>
        <input id="fileInput" type="file" accept=".glb,model/gltf-binary">
      </div>

      <div class="group">
        <label for="sceneJson">Scene JSON</label>
        <textarea id="sceneJson" spellcheck="false" placeholder="{&quot;sceneId&quot;:&quot;floorplan_json&quot;,&quot;unit&quot;:&quot;meter&quot;,...}"></textarea>
        <input id="jsonFileInput" type="file" accept=".json,application/json,text/json">
        <div class="buttons">
          <button class="primary" id="buildJson" type="button">Build</button>
          <button id="clearJson" type="button">Clear</button>
        </div>
      </div>

      <div class="metrics">
        <div class="metric">
          <span>Nodes</span>
          <strong id="nodeCount">0</strong>
        </div>
        <div class="metric">
          <span>Size</span>
          <strong id="modelSize">0 m</strong>
        </div>
      </div>

      <div id="status">Ready</div>
    </aside>

    <main>
      <canvas id="viewport"></canvas>
    </main>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const canvas = document.getElementById("viewport");
    const statusEl = document.getElementById("status");
    const nodeCountEl = document.getElementById("nodeCount");
    const modelSizeEl = document.getElementById("modelSize");
    const modelUrlEl = document.getElementById("modelUrl");
    const fileInputEl = document.getElementById("fileInput");
    const sceneJsonEl = document.getElementById("sceneJson");
    const jsonFileInputEl = document.getElementById("jsonFileInput");
    const buildJsonEl = document.getElementById("buildJson");
    const initialModelUrl = new URLSearchParams(window.location.search).get("model");
    if (initialModelUrl) {
      modelUrlEl.value = initialModelUrl;
    }

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0xeef1f4, 1);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 1000);
    camera.position.set(6, 5, 7);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(3, 1.4, 2);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x8d99a6, 1.8));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
    keyLight.position.set(4, 9, 6);
    scene.add(keyLight);

    const grid = new THREE.GridHelper(12, 24, 0x9aa3ad, 0xc2c8d0);
    grid.position.y = -0.03;
    scene.add(grid);

    const axes = new THREE.AxesHelper(1.2);
    scene.add(axes);

    const loader = new GLTFLoader();
    let currentModel = null;
    let currentObjectUrl = null;

    function setStatus(message, tone = "") {
      statusEl.textContent = message;
      statusEl.className = tone;
    }

    function withCacheBust(url) {
      if (url.startsWith("blob:")) return url;
      const separator = url.includes("?") ? "&" : "?";
      return `${url}${separator}t=${Date.now()}`;
    }

    function disposeCurrentModel() {
      if (!currentModel) return;
      scene.remove(currentModel);
      currentModel.traverse((object) => {
        if (object.geometry) object.geometry.dispose();
        if (object.material) {
          const materials = Array.isArray(object.material) ? object.material : [object.material];
          for (const material of materials) material.dispose();
        }
      });
      currentModel = null;
    }

    function loadModel(url, successMessage = "") {
      setStatus(`Loading ${url}`, "busy");
      loader.load(
        url,
        (gltf) => {
          disposeCurrentModel();
          currentModel = gltf.scene;
          scene.add(currentModel);
          fitView(currentModel);
          updateMetrics(currentModel);
          setStatus(successMessage || `Loaded ${url}`, "success");
        },
        undefined,
        (error) => {
          console.error(error);
          setStatus(`Load failed: ${error.message || error}`, "error");
        }
      );
    }

    function fitView(object) {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxSize = Math.max(size.x, size.y, size.z, 1);
      const distance = maxSize * 1.45;
      camera.position.set(center.x + distance, center.y + distance * 0.75, center.z + distance);
      camera.near = Math.max(0.01, maxSize / 1000);
      camera.far = maxSize * 100;
      camera.updateProjectionMatrix();
      controls.target.copy(center);
      controls.update();
    }

    function updateMetrics(object) {
      let nodes = 0;
      object.traverse(() => nodes += 1);
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      nodeCountEl.textContent = String(nodes);
      modelSizeEl.textContent = `${size.x.toFixed(1)} x ${size.y.toFixed(1)} x ${size.z.toFixed(1)}`;
    }

    function resetView() {
      if (currentModel) {
        fitView(currentModel);
      } else {
        camera.position.set(6, 5, 7);
        controls.target.set(3, 1.4, 2);
        controls.update();
      }
    }

    document.getElementById("loadUrl").addEventListener("click", () => {
      loadModel(modelUrlEl.value.trim());
    });

    document.getElementById("resetView").addEventListener("click", resetView);

    document.getElementById("clearJson").addEventListener("click", () => {
      sceneJsonEl.value = "";
    });

    fileInputEl.addEventListener("change", () => {
      const file = fileInputEl.files && fileInputEl.files[0];
      if (!file) return;
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = URL.createObjectURL(file);
      loadModel(currentObjectUrl);
    });

    jsonFileInputEl.addEventListener("change", async () => {
      const file = jsonFileInputEl.files && jsonFileInputEl.files[0];
      if (!file) return;
      sceneJsonEl.value = await file.text();
      setStatus(`Loaded JSON file ${file.name}`, "success");
    });

    buildJsonEl.addEventListener("click", buildFromJson);

    async function buildFromJson() {
      const rawJson = sceneJsonEl.value.trim();
      if (!rawJson) {
        setStatus("Paste scene JSON or choose a JSON file first.", "error");
        sceneJsonEl.focus();
        return;
      }

      let payload;
      try {
        payload = JSON.parse(rawJson);
      } catch (error) {
        setStatus(`JSON parse failed: ${error.message}`, "error");
        return;
      }

      buildJsonEl.disabled = true;
      buildJsonEl.textContent = "Building...";
      setStatus("Building whitebox GLB...", "busy");
      try {
        const response = await fetch("http://127.0.0.1:8000/api/floorplan/build-whitebox", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.detail || `HTTP ${response.status}`);
        }
        const glbUrl = withCacheBust(data.whiteboxGlbUrl);
        modelUrlEl.value = glbUrl;
        loadModel(glbUrl, `Built and loaded ${data.sceneId}`);
      } catch (error) {
        setStatus(`Build failed: ${error.message || error}`, "error");
      } finally {
        buildJsonEl.disabled = false;
        buildJsonEl.textContent = "Build";
      }
    }

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const width = Math.max(1, Math.floor(rect.width));
      const height = Math.max(1, Math.floor(rect.height));
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    function animate() {
      resize();
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
    loadModel(modelUrlEl.value.trim());
  </script>
</body>
</html>
