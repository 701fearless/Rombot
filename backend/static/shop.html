<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roombot 选品</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1c241f;
      --muted: #5f6d64;
      --line: #d7ddd8;
      --paper: #f2f0ea;
      --panel: #fffdf8;
      --accent: #1f6b4f;
      --accent-soft: #d8efe4;
      --shadow: 0 18px 50px rgba(28, 36, 31, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1000px 420px at 10% -10%, #e7f3ec, transparent 60%),
        radial-gradient(800px 360px at 100% 0%, #efe8da, transparent 55%),
        var(--paper);
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    header {
      display: flex; justify-content: space-between; align-items: end; gap: 16px;
      margin-bottom: 28px;
    }
    .brand {
      font-family: "Instrument Serif", serif;
      font-size: clamp(2rem, 4vw, 3rem);
      margin: 0;
      letter-spacing: -0.02em;
    }
    .sub { color: var(--muted); margin: 8px 0 0; }
    .nav { display: flex; gap: 10px; flex-wrap: wrap; }
    .nav a, button {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font: inherit;
    }
    .nav a:hover, button:hover { border-color: var(--accent); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .card, .detail {
      background: var(--panel);
      border: 1px solid rgba(28,36,31,0.08);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card img, .detail img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: #ece8df;
      display: block;
    }
    .card .body, .detail .body { padding: 14px 16px 18px; }
    .title { font-weight: 700; line-height: 1.3; }
    .meta { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }
    .price { margin-top: 10px; color: var(--accent); font-weight: 700; }
    .detail {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 0;
    }
    .detail .body { padding: 28px; }
    .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    .actions .primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .empty, .status {
      color: var(--muted);
      padding: 28px 8px;
    }
    .cart-list { display: grid; gap: 12px; }
    .cart-item {
      display: grid;
      grid-template-columns: 84px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      background: var(--panel);
      border-radius: 18px;
      border: 1px solid var(--line);
    }
    .cart-item img { width: 84px; height: 84px; object-fit: cover; border-radius: 12px; }
    @media (max-width: 780px) {
      .detail { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1 class="brand">Roombot Shop</h1>
        <p class="sub" id="subtitle">本地精选 · 不跳转外链</p>
      </div>
      <nav class="nav">
        <a href="/static/image-search.html">图搜</a>
        <a href="#/">商品</a>
        <a href="#/cart">购物车 <span id="cartCount">0</span></a>
      </nav>
    </header>
    <main id="app"><div class="status">加载中…</div></main>
  </div>
  <script>
    const CART_KEY = "rombot_shop_cart_v1";
    const app = document.getElementById("app");
    const cartCount = document.getElementById("cartCount");
    const subtitle = document.getElementById("subtitle");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function loadCart() {
      try { return JSON.parse(localStorage.getItem(CART_KEY) || "[]"); }
      catch { return []; }
    }
    function saveCart(items) {
      localStorage.setItem(CART_KEY, JSON.stringify(items));
      cartCount.textContent = String(items.length);
    }
    function addToCart(product) {
      const cart = loadCart().filter((item) => item.productId !== product.productId);
      cart.unshift({
        productId: product.productId,
        title: product.title,
        price: product.price,
        currency: product.currency,
        imageUrl: product.imageUrl
      });
      saveCart(cart);
    }

    function priceText(product) {
      if (product.price == null) return "价格待定";
      return `${product.currency || ""} ${product.price}`;
    }

    function route() {
      const hash = location.hash.replace(/^#\/?/, "");
      const [page, id] = hash.split("/");
      if (page === "p" && id) return renderProduct(id);
      if (page === "cart") return renderCart();
      return renderCatalog();
    }

    async function renderCatalog() {
      subtitle.textContent = "来自本地图库检索的商品合集";
      app.innerHTML = `<div class="status">读取本地检索结果…</div>`;
      let products = [];
      try {
        const history = await fetch("/api/shop/search-history?limit=80").then((r) => r.json());
        for (const row of history.items || []) {
          for (const product of row.results || []) products.push(product);
        }
      } catch {}
      try {
        const lib = await fetch("/api/shop/library-matches").then((r) => r.ok ? r.json() : null);
        if (lib?.items) {
          for (const item of lib.items) {
            for (const product of item.products || []) products.push(product);
          }
        }
      } catch {}
      const map = new Map();
      for (const product of products) {
        if (product?.productId) map.set(product.productId, product);
      }
      const list = [...map.values()];
      if (!list.length) {
        app.innerHTML = `<div class="empty">还没有本地商品结果。请先打开图搜页，或运行批处理脚本扫描 vedios。</div>`;
        return;
      }
      app.innerHTML = `<div class="grid">${list.map((product) => `
        <a class="card" href="#/p/${escapeHtml(product.productId)}">
          <img src="${escapeHtml(product.imageUrl || "")}" alt="" loading="lazy" />
          <div class="body">
            <div class="title">${escapeHtml(product.title)}</div>
            <div class="meta">${escapeHtml(product.category || "")}</div>
            <div class="price">${escapeHtml(priceText(product))}</div>
          </div>
        </a>`).join("")}</div>`;
    }

    async function renderProduct(productId) {
      subtitle.textContent = "商品详情（本地缓存）";
      app.innerHTML = `<div class="status">加载商品…</div>`;
      const response = await fetch(`/api/shop/products/${encodeURIComponent(productId)}`);
      if (!response.ok) {
        app.innerHTML = `<div class="empty">找不到商品 ${escapeHtml(productId)}</div>`;
        return;
      }
      const product = await response.json();
      app.innerHTML = `
        <article class="detail">
          <img src="${escapeHtml(product.imageUrl || "")}" alt="" />
          <div class="body">
            <div class="meta">SKU ${escapeHtml(product.sku || product.productId)}</div>
            <h2 class="title" style="font-size:1.8rem;margin:8px 0 0">${escapeHtml(product.title)}</h2>
            <div class="price" style="font-size:1.3rem">${escapeHtml(priceText(product))}</div>
            <p class="meta" style="margin-top:16px;line-height:1.6">${escapeHtml(product.description || "暂无描述")}</p>
            <p class="meta">${escapeHtml([product.category, product.subcategory].filter(Boolean).join(" / "))}</p>
            <div class="actions">
              <button class="primary" id="addCart">加入购物车</button>
              <a href="#/cart">查看购物车</a>
              <a href="/static/image-search.html">继续图搜</a>
            </div>
          </div>
        </article>`;
      document.getElementById("addCart").onclick = () => {
        addToCart(product);
        document.getElementById("addCart").textContent = "已加入";
      };
    }

    function renderCart() {
      subtitle.textContent = "本地购物车";
      const cart = loadCart();
      if (!cart.length) {
        app.innerHTML = `<div class="empty">购物车是空的。<a href="#/">去看看商品</a></div>`;
        return;
      }
      app.innerHTML = `<div class="cart-list">${cart.map((item, index) => `
        <div class="cart-item">
          <img src="${escapeHtml(item.imageUrl || "")}" alt="" />
          <div>
            <div class="title">${escapeHtml(item.title)}</div>
            <div class="meta">${escapeHtml(priceText(item))}</div>
          </div>
          <button data-i="${index}">移除</button>
        </div>`).join("")}</div>`;
      app.querySelectorAll("button[data-i]").forEach((button) => {
        button.onclick = () => {
          const next = loadCart();
          next.splice(Number(button.dataset.i), 1);
          saveCart(next);
          renderCart();
        };
      });
    }

    window.addEventListener("hashchange", route);
    cartCount.textContent = String(loadCart().length);
    route();
  </script>
</body>
</html>
