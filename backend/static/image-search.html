<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>宜家图搜图预览</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,700;1,9..40,500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a221c;
      --muted: #5c6b62;
      --line: #d5ddd7;
      --paper: #f3f1eb;
      --panel: #fffdf8;
      --accent: #0f6b4c;
      --accent-soft: #d9efe4;
      --shadow: 0 18px 50px rgba(26, 34, 28, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "DM Sans", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #e7f3ec 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #efe6d6 0%, transparent 50%),
        var(--paper);
    }
    .page { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 64px; }
    .brand {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(2.4rem, 5vw, 3.6rem);
      line-height: 0.95; margin: 0; letter-spacing: -0.02em;
    }
    .lead { margin: 12px 0 0; max-width: 42rem; color: var(--muted); font-size: 1.02rem; line-height: 1.55; }
    .shell {
      margin-top: 28px;
      display: grid;
      grid-template-columns: minmax(300px, 0.95fr) minmax(0, 1.05fr);
      gap: 22px; align-items: start;
    }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      box-shadow: var(--shadow); border-radius: 4px;
    }
    .drop {
      position: relative; min-height: 320px; display: grid; place-items: center;
      padding: 18px; cursor: pointer; overflow: hidden;
    }
    .drop input { display: none; }
    .drop-idle { text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
    .drop-idle strong { color: var(--ink); font-size: 1.05rem; }
    .drop.has-image .drop-idle { display: none; }
    .preview { display: none; width: 100%; max-height: 320px; object-fit: contain; background: #111814; }
    .drop.has-image .preview { display: block; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      padding: 14px 16px; border-top: 1px solid var(--line);
    }
    .hint-box {
      padding: 12px 16px; border-top: 1px solid var(--line);
      background: #f7faf7; color: var(--muted); font-size: 0.9rem; line-height: 1.45;
    }
    .hint-box strong { color: var(--ink); }
    .thumbs {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); max-height: 220px; overflow: auto;
    }
    .thumb {
      border: 1px solid var(--line); padding: 0; background: #fff; cursor: pointer;
    }
    .thumb.active { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
    .thumb img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
    label.inline { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.92rem; }
    input[type="number"] {
      width: 64px; border: 1px solid var(--line); background: #fff; padding: 8px 10px; font: inherit;
    }
    button {
      font: inherit; border: 0; cursor: pointer; padding: 11px 16px;
      background: var(--accent); color: #fff; font-weight: 700;
    }
    button:disabled { opacity: 0.45; cursor: wait; }
    button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .results { padding: 16px; min-height: 420px; }
    .results-head {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 12px; margin-bottom: 14px;
    }
    .results-head h2 {
      margin: 0; font-family: "Instrument Serif", Georgia, serif;
      font-size: 1.7rem; font-weight: 400;
    }
    .status { color: var(--muted); font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .item {
      display: grid; gap: 8px; text-decoration: none; color: inherit;
      border: 1px solid var(--line); background: #fff; padding: 10px;
      transition: border-color .15s ease, transform .15s ease;
    }
    .item:hover { border-color: var(--accent); transform: translateY(-2px); }
    .item img { width: 100%; aspect-ratio: 1; object-fit: contain; background: var(--accent-soft); }
    .rank { font-size: 0.78rem; color: var(--accent); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .title { font-size: 0.92rem; font-weight: 700; line-height: 1.35; min-height: 2.5em; }
    .meta { color: var(--muted); font-size: 0.82rem; line-height: 1.4; }
    .empty {
      min-height: 320px; display: grid; place-items: center; color: var(--muted);
      text-align: center; padding: 24px; border: 1px dashed var(--line);
    }
    .error {
      margin: 0 16px 16px; padding: 10px 12px; background: #f8e8e5; color: #8a2f24;
      font-size: 0.9rem; white-space: pre-wrap; word-break: break-word;
    }
    @media (max-width: 860px) { .shell { grid-template-columns: 1fr; } .drop { min-height: 240px; } }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="brand">IKEA Visual Search</h1>
    <p class="lead">
      直接图搜图，并结合父目录 <code>analysis.json</code> 里的家具描述做图文融合，提高匹配准确度。
      推荐用「选择视频目录」一次带上图片和 JSON。
    </p>

    <section class="shell">
      <div class="card">
        <label class="drop" id="drop">
          <input id="file" type="file" accept="image/*" />
          <span class="drop-idle">
            <strong>拖入或选择单张图片</strong>
            <span>也可下方选择整个视频目录（含 analysis.json）</span>
          </span>
          <img id="preview" class="preview" alt="查询图" />
        </label>

        <div class="controls">
          <button id="folderBtn" class="ghost" type="button">选择视频目录</button>
          <input id="folderInput" type="file" webkitdirectory directory multiple hidden />
          <label class="inline">Top-K <input id="topK" type="number" min="1" max="20" value="8" /></label>
          <label class="inline">文本权重 <input id="textWeight" type="number" min="0" max="0.85" step="0.05" value="0.45" /></label>
          <button id="searchBtn" type="button" disabled>开始搜索</button>
          <button id="clearBtn" class="ghost" type="button">清空</button>
        </div>

        <div id="hintBox" class="hint-box">尚未加载描述 JSON。单图模式也可手动再选 analysis.json。</div>
        <div class="controls" id="jsonRow">
          <button id="jsonBtn" class="ghost" type="button">补充 / 更换 analysis.json</button>
          <input id="jsonInput" type="file" accept="application/json,.json" hidden />
          <span id="jsonStatus" class="status">JSON：未加载</span>
        </div>
        <div id="thumbs" class="thumbs" hidden></div>
        <div id="error" class="error" hidden></div>
      </div>

      <div class="card results">
        <div class="results-head">
          <h2>相似商品</h2>
          <div id="status" class="status">等待上传</div>
        </div>
        <div id="grid" class="grid"></div>
        <div id="empty" class="empty">结果会出现在这里</div>
      </div>
    </section>
  </main>

  <script>
    const drop = document.getElementById("drop");
    const fileInput = document.getElementById("file");
    const folderBtn = document.getElementById("folderBtn");
    const folderInput = document.getElementById("folderInput");
    const jsonBtn = document.getElementById("jsonBtn");
    const jsonInput = document.getElementById("jsonInput");
    const jsonStatus = document.getElementById("jsonStatus");
    const preview = document.getElementById("preview");
    const searchBtn = document.getElementById("searchBtn");
    const clearBtn = document.getElementById("clearBtn");
    const topKInput = document.getElementById("topK");
    const textWeightInput = document.getElementById("textWeight");
    const statusEl = document.getElementById("status");
    const hintBox = document.getElementById("hintBox");
    const thumbs = document.getElementById("thumbs");
    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const errorEl = document.getElementById("error");

    let dataUrl = null;
    let imageName = null;
    let imagePath = null;
    let analysis = null;
    let hint = null;
    let gallery = [];

    function setError(message) {
      if (!message) {
        errorEl.hidden = true;
        errorEl.textContent = "";
        return;
      }
      errorEl.hidden = false;
      errorEl.textContent = message;
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = String(value ?? "");
      return div.innerHTML;
    }

    function findObjectHint(analysisPayload, ref) {
      if (!analysisPayload || !ref) return null;
      const normalized = String(ref).replace(/\\/g, "/");
      const name = normalized.split("/").pop();
      const stem = name.replace(/\.[^.]+$/, "");
      const candidateMatch = normalized.match(/(candidate_[a-z0-9_]+)/i);
      const objectMatch = normalized.match(/(obj_[a-z0-9_]+)/i);
      const candidateId = candidateMatch && candidateMatch[1];
      const objectId = objectMatch && objectMatch[1];
      const dedup = analysisPayload.deduplicatedObjects || [];
      const frames = analysisPayload.frames || [];

      if (candidateId) {
        const item = dedup.find((row) => row.id === candidateId);
        if (item) return hintFromDedup(analysisPayload, item);
      }
      if (objectId) {
        for (const frame of frames) {
          const obj = (frame.objects || []).find((row) => row.id === objectId);
          if (obj) return hintFromObject(obj);
        }
      }
      for (const item of dedup) {
        const blob = [item.cropUrl, item.annotatedImageUrl, item.id, item.name, item.label].join(" ");
        if (blob.includes(stem) || blob.includes(name)) return hintFromDedup(analysisPayload, item);
      }
      for (const frame of frames) {
        for (const obj of frame.objects || []) {
          const blob = [obj.cropUrl, obj.deduplicatedCropUrl, obj.id, obj.name, obj.label].join(" ");
          if (blob.includes(stem) || blob.includes(name)) return hintFromObject(obj);
        }
      }
      return null;
    }

    function hintFromObject(obj) {
      return {
        id: obj.id,
        deduplicatedObjectId: obj.deduplicatedObjectId,
        label: obj.label,
        name: obj.name,
        visualFeatures: obj.visualFeatures || {},
        confidence: obj.confidence
      };
    }

    function hintFromDedup(analysisPayload, item) {
      for (const frame of analysisPayload.frames || []) {
        for (const obj of frame.objects || []) {
          if (obj.deduplicatedObjectId === item.id && obj.visualFeatures) {
            const hintObj = hintFromObject(obj);
            hintObj.id = item.id;
            return hintObj;
          }
        }
      }
      return {
        id: item.id,
        deduplicatedObjectId: item.id,
        label: item.label,
        name: item.name,
        visualFeatures: item.visualFeatures || {},
        confidence: item.confidence
      };
    }

    function summarizeHint(current) {
      if (!current) {
        hintBox.innerHTML = "未匹配到家具描述。将仅用图片检索（准确度较低）。";
        return;
      }
      const features = current.visualFeatures || {};
      const bits = [
        current.name || current.label,
        features.style,
        Array.isArray(features.colors) ? features.colors.join("/") : "",
        Array.isArray(features.materials) ? features.materials.join("/") : "",
        features.geometry
      ].filter(Boolean);
      hintBox.innerHTML = `<strong>已匹配描述</strong> · ${escapeHtml(bits.join(" · "))}`;
    }

    function refreshHint() {
      hint = findObjectHint(analysis, imagePath || imageName || "");
      summarizeHint(hint);
      jsonStatus.textContent = analysis
        ? `JSON：已加载（videoId=${analysis.videoId || "?"}，候选 ${(analysis.deduplicatedObjects || []).length}）`
        : "JSON：未加载";
    }

    function setImage(url, name, path) {
      dataUrl = url;
      imageName = name || "query.jpg";
      imagePath = path || name || "";
      preview.src = url;
      drop.classList.add("has-image");
      searchBtn.disabled = false;
      statusEl.textContent = "已就绪，可搜索";
      setError("");
      refreshHint();
    }

    function clearAll() {
      dataUrl = null;
      imageName = null;
      imagePath = null;
      analysis = null;
      hint = null;
      gallery = [];
      fileInput.value = "";
      folderInput.value = "";
      jsonInput.value = "";
      preview.removeAttribute("src");
      drop.classList.remove("has-image");
      searchBtn.disabled = true;
      grid.innerHTML = "";
      empty.hidden = false;
      thumbs.hidden = true;
      thumbs.innerHTML = "";
      statusEl.textContent = "等待上传";
      refreshHint();
      setError("");
    }

    function readImageFile(file, path) {
      if (!file || !file.type.startsWith("image/")) return;
      const reader = new FileReader();
      reader.onload = () => setImage(reader.result, file.name, path || file.webkitRelativePath || file.name);
      reader.readAsDataURL(file);
    }

    async function readJsonFile(file) {
      const text = await file.text();
      analysis = JSON.parse(text);
      refreshHint();
    }

    function parentDir(relativePath) {
      const parts = String(relativePath || "").replace(/\\/g, "/").split("/").filter(Boolean);
      parts.pop();
      return parts.join("/");
    }

    function findAnalysisNear(files, imageRelativePath) {
      const imageDir = parentDir(imageRelativePath);
      const parent = parentDir(imageDir);
      const grand = parentDir(parent);
      const candidates = [
        `${imageDir}/analysis.json`,
        `${parent}/analysis.json`,
        `${grand}/analysis.json`,
        "analysis.json"
      ];
      for (const key of candidates) {
        const hit = files.find((file) => {
          const rel = (file.webkitRelativePath || file.name).replace(/\\/g, "/");
          return rel === key || rel.endsWith("/" + key) || rel.split("/").slice(-1)[0] === "analysis.json" && (
            parentDir(rel) === imageDir || parentDir(rel) === parent || parentDir(rel) === grand
          );
        });
        if (hit) return hit;
      }
      return files.find((file) => (file.webkitRelativePath || file.name).replace(/\\/g, "/").endsWith("analysis.json")) || null;
    }

    async function loadFolder(fileList) {
      const files = Array.from(fileList || []);
      if (!files.length) return;
      const imageFiles = files.filter((file) => /\.(jpe?g|png|webp)$/i.test(file.name));
      const preferred = imageFiles.filter((file) => /deduplicated[/\\]candidate_[^/\\]+[/\\]crop\.(jpe?g|png|webp)$/i.test(file.webkitRelativePath || file.name));
      gallery = (preferred.length ? preferred : imageFiles).slice(0, 80).map((file) => ({
        file,
        path: file.webkitRelativePath || file.name
      }));

      const first = gallery[0];
      if (!first) {
        setError("目录里没有找到图片");
        return;
      }

      const analysisFile = findAnalysisNear(files, first.path);
      if (analysisFile) {
        await readJsonFile(analysisFile);
      } else {
        analysis = null;
        refreshHint();
        setError("未在图片所在文件夹的上一级/上上级找到 analysis.json，可手动补充。");
      }

      renderThumbs();
      readImageFile(first.file, first.path);
    }

    function renderThumbs() {
      if (!gallery.length) {
        thumbs.hidden = true;
        thumbs.innerHTML = "";
        return;
      }
      thumbs.hidden = false;
      thumbs.innerHTML = "";
      gallery.forEach((item, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "thumb" + (item.path === imagePath ? " active" : "");
        const img = document.createElement("img");
        img.alt = item.file.name;
        button.appendChild(img);
        const url = URL.createObjectURL(item.file);
        img.src = url;
        button.addEventListener("click", () => {
          readImageFile(item.file, item.path);
          Array.from(thumbs.children).forEach((node, i) => node.classList.toggle("active", i === index));
        });
        thumbs.appendChild(button);
      });
    }

    drop.addEventListener("dragover", (event) => event.preventDefault());
    drop.addEventListener("drop", async (event) => {
      event.preventDefault();
      const files = event.dataTransfer.files;
      if (!files || !files.length) return;
      if (files.length > 1 || (files[0].webkitRelativePath && files[0].webkitRelativePath.includes("/"))) {
        await loadFolder(files);
        return;
      }
      readImageFile(files[0], files[0].name);
    });
    fileInput.addEventListener("change", () => readImageFile(fileInput.files[0], fileInput.files[0] && fileInput.files[0].name));
    folderBtn.addEventListener("click", () => folderInput.click());
    folderInput.addEventListener("change", () => loadFolder(folderInput.files));
    jsonBtn.addEventListener("click", () => jsonInput.click());
    jsonInput.addEventListener("change", async () => {
      if (!jsonInput.files[0]) return;
      try {
        await readJsonFile(jsonInput.files[0]);
        setError("");
      } catch (error) {
        setError("JSON 解析失败：" + (error.message || error));
      }
    });
    clearBtn.addEventListener("click", clearAll);

    searchBtn.addEventListener("click", async () => {
      if (!dataUrl) return;
      const topK = Math.min(20, Math.max(1, Number(topKInput.value) || 8));
      const textWeight = Math.min(0.85, Math.max(0, Number(textWeightInput.value) || 0.45));
      searchBtn.disabled = true;
      statusEl.textContent = "检索中…（图文融合，首次约十几秒）";
      setError("");
      empty.hidden = true;
      grid.innerHTML = "";
      const started = performance.now();
      try {
        const body = {
          image: dataUrl,
          topK,
          textWeight,
          imageName: imagePath || imageName
        };
        if (hint) body.hint = hint;
        else if (analysis) body.analysis = analysis;
        const response = await fetch("/api/video/clip-search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const text = await response.text();
        if (!response.ok) throw new Error(text || response.statusText);
        const payload = JSON.parse(text);
        const results = payload.results || [];
        const elapsed = ((performance.now() - started) / 1000).toFixed(1);
        const label = payload.label ? ` · ${payload.label}` : "";
        statusEl.textContent = `${results.length} 条 · ${elapsed}s${label}`;
        if (payload.queryText) {
          hintBox.innerHTML = `<strong>检索文本</strong> · ${escapeHtml(payload.queryText)}`;
        }
        if (!results.length) {
          empty.hidden = false;
          empty.textContent = "没有找到相似商品";
          return;
        }
        grid.innerHTML = results.map((item) => {
          const image = item.imageUrl || (item.localImage ? `/product_index/${item.localImage}` : "");
          const price = item.price != null ? `${item.currency || ""} ${item.price}` : "n/a";
          const href = item.productUrl || "#";
          const boost = item.labelBoost != null ? ` · boost ${Number(item.labelBoost).toFixed(2)}` : "";
          return `<a class="item" href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">
            <img src="${escapeHtml(image)}" alt="" loading="lazy" />
            <div class="rank">#${item.rank} · ${Number(item.score || 0).toFixed(3)}${boost}</div>
            <div class="title">${escapeHtml(item.title || item.productId)}</div>
            <div class="meta">${escapeHtml(price)}<br>${escapeHtml(item.category2 || "")} / ${escapeHtml(item.category3 || "")}</div>
          </a>`;
        }).join("");
      } catch (error) {
        empty.hidden = false;
        empty.textContent = "搜索失败";
        statusEl.textContent = "失败";
        setError(String(error.message || error));
      } finally {
        searchBtn.disabled = !dataUrl;
      }
    });

    refreshHint();
  </script>
</body>
</html>
